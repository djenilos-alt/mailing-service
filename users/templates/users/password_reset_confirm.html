<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Новый пароль</title>
</head>
<body>
    <h1>Установка нового пароля</h1>

    {% if validlink %}
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Сохранить новый пароль</button>
        </form>
    {% else %}
        <p>Ссылка недействительна или срок её действия истёк.</p>
    {% endif %}
</body>
</html>
