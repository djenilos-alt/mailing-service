{% extends "mailing/base.html" %}

{% block content %}
<h2>{{ recipient.full_name }}</h2>

<div class="card shadow-sm">
    <div class="card-body">
        <p><strong>Email:</strong> {{ recipient.email }}</p>
        <p><strong>Комментарий:</strong> {{ recipient.comment|default:"Нет комментария" }}</p>

        <a href="{% url 'mailing:recipient_update' recipient.pk %}"
           class="btn btn-warning">Изменить</a>

        <a href="{% url 'mailing:recipient_list' %}"
           class="btn btn-secondary">Назад</a>
    </div>
</div>
{% endblock %}
