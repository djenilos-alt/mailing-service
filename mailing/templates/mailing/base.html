{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Сервис рассылок{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Сервис рассылок</a>

        <div class="navbar-nav">
            <a class="nav-link" href="/mailing/recipients/">Клиенты</a>
            <a class="nav-link" href="/mailing/messages/">Сообщения</a>
            <a class="nav-link" href="/mailing/mailings/">Рассылки</a>
            <a class="nav-link" href="/admin/">Администрирование</a>
            <a class="nav-link" href="{% url 'service:home' %}">
                Главная
            </a>
        </div>
    </div>
</nav>

<main class="container py-4">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-info">{{ message }}</div>
        {% endfor %}
    {% endif %}

    {% block content %}
    {% endblock %}
</main>

<footer class="text-center text-muted py-4">
    <p>Сервис управления email-рассылками</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
